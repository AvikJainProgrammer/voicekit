[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voicekit"
version = "0.1.0"
description = "Reusable voice recording, transcription, phonetic matching, and fuzzy matching toolkit."
requires-python = ">=3.10"
dependencies = [
    "faster-whisper",
    "torch",
    # Silero VAD's torch.hub loader (VoiceRecorder) imports torchaudio at
    # load time; without it VoiceRecorder() raises ModuleNotFoundError.
    "torchaudio",
    "transformers",
    "sounddevice",
    "rapidfuzz",
    "numpy",
]

[tool.setuptools.packages.find]
where = ["src"]
